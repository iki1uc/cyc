      const fundament = /RAID_FUNDAMENT=(\\d+)%/.exec(text);
      const f = fundament ? parseInt(fundament[1]) : 0;
      return hasReady && hasStatus && hasParity && f >= 70;
    } catch (e) {
      console.warn('[SLI_RAID] .ready nicht gefunden, fallback .js', e);
      return false;
    }
  },

  // If .ready reicht -> normal boot, sonst rebuild
  init: async () => {
    const ready = await SLI_RAID.isReady();
    if (ready) {
      console.log('%c[SLI_RAID] sli.raid.ready reicht - RAID READY','color:#00ff88');
      return SLI_RAID.boot();
    } else {
      console.log('%c[SLI_RAID] sli.raid.ready reicht nicht - sli.raid.js übernimmt','color:#ffcc00');
      return SLI_RAID.rebuild();
    }
  },

  boot: async () => {
    // Chain: USER -> LHA -> HDF -> RAID -> SWAP -> RAM -> BALL+WETTER+ROLLE -> CPU
    for (const step of SLI_RAID.chain) {
      console.log(\`[BOOT] \${step} -> OK\`);
      await SLI_RAID.sleep(80);
    }
    SLI_RAID.setupSLI();
    SLI_RAID.earn.schubstZumZiel();
    return { status: 'READY', sli: true };
  },

  setupSLI: () => {
    // SLI Scanline Interleave 8-way - wie 2x Voodoo2 damals, aber 8x
    console.log('[SLI] SCANLINE_INTERLEAVE_8WAY aktiv');
    const scanlines = 8;
    for (let i=0;i<scanlines;i++) {
      const disk = i % SLI_RAID.disks;
      // Interleave logic: gerade Zeilen GPU0, ungerade GPU1 etc -> hier 8-way
      console.log(\`[SLI] DISK_\${disk} scanline \${i} -> INTERLEAVED\`);
    }
  },

  rebuild: async () => {
    console.log('[REBUILD] Starte BORG 7482 rebuild - 81 kompendium check');
    // 81 kompendium truth repair, wahrheitsnaehe <5%
    let wahrheit = 100;
    for (let i=0;i<SLI_RAID.kompendium.total;i++) {
      const diff = Math.random()*2;
      if (diff < 5) {
        console.log(\`[KOMPENDIUM \${i+1}/81] OK - diff \${diff.toFixed(2)}%\`);
      } else {
        console.warn(\`[KOMPENDIUM \${i+1}/81] REPAIR - diff \${diff.toFixed(2)}% >5%\`);
        wahrheit -= 0.38;
      }
      await SLI_RAID.sleep(12);
    }
    console.log(\`[REBUILD] Fundament \${SLI_RAID.fundament}% gehalten, Wahrheitsnaehe \${(100-wahrheit).toFixed(2)}%\`);
    console.log('[REBUILD] Parity rebuild - 73% fundament OK');
    return SLI_RAID.boot();
  },

  hotPlug: async (id, desc) => {
    console.log(\`[HOT_PLUG] DISK_\${id} \${desc} -> ONLINE\`);
    SLI_RAID.disks++;
    await SLI_RAID.rebuild();
  },

  sleep: (ms) => new Promise(r => setTimeout(r, ms)),

  // Earn CPU integration - iki1uc cycOS
  earn: {
    iqq: 147,
    lernrichtung: [1,0,1],
    schubstZumZiel: () => {
      console.log('[EARN] IQQ 147 - Lernrichtung [1,0,1] -> schubst alle zum ZIEL 100% BALL+TOR');
      // Push all subsystems to 100%
      SLI_RAID.chain.forEach(c => {
        console.log(\`[EARN] \${c} -> 100%\`);
      });
    },
    findeBestePaarung: () => {
      // MIN_DIFF 0.38% BESTE PAARUNG rom.html + TURBO_18
      return { paarung: 'rom.html+TURBO_18', diff: 0.38 };
    }
  },

  // VEC_OS LOCKED check, QI81 81/81
  vecCheck: () => {
    const locked = true; // VEC_OS=LOCKED
    const qi = '81/81';
    console.log(\`[VEC] OS \${locked ? 'LOCKED' : 'UNLOCKED'} QI \${qi} LABAR_MATAHARI=)9(\`);
    return locked && qi === '81/81';
  }
};

// Auto init - cycOS style
if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => {
    SLI_RAID.init();
  });
}

// Export for cycOS - index.html SC kann prüfen
if (typeof window !== 'undefined') {
  window.SLI_RAID = SLI_RAID;
}
