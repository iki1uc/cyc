'Hello' to 'Goodbye' · 8m ago"},{name:"earn.js",alias:"Learning Direction IQQ",desc:"Learning Direction + IQQ Adjustment Algorithm",role:"EARN LOGIC",size:"2.2 KB",commit:"Implement learning direction and IQQ adjustment · 49m ago"}],w0="# cyc · RAM und ROM · ball + wetter + rolle Abhängigkeiten\n\n> **STATUS:** `ram/` und `rom/` habe ich noch nicht aber sie müssen ball und wetter und rolle Abhängigkeiten verregeln — dieses README fixiert die Regeln.\n\n`iki1uc/cyc` ist ein BORG HUB System (7482). Alle `.html` Files sind Module, die über `index.html` geladen werden. Ohne RAM/ROM Quellen bleibt `ball` leer.\n\n---\n\n## 01 — Repo Struktur\n\n| File | Alias | Was es tut | Rolle |\n|------|-------|------------|-------|\n| `index.html` | cyc.htm | **HUB BORG 7482** — lädt alle Module als IFrame / Fetch Layer. Entry Point. | `HUB` |\n| `ball.html` | Ramdisk-Ball-Runtime-2in1 | Minimaler Ball Runtime, 2in1 = RAMDISK + EXEC. Braucht `ramdisk/` + `spin.rom`. | `BALL` |\n| `wetter.html` | Eiserne-Render-Internet-Wetter | Rendert Wetter Partikel, holt Internet Wetter via CDN vs GitHub Pages Regel | `WETTER` |\n| `rolle.html` | — | Definiert wer was tut: Ball Entwickler vs Tor Macher vs Feld | `ROLLE` |\n| `scsi.html` | Turboarte Controller | SCSI 8te Sorter — sortiert Turboarte Datenströme, Bridge zu ROM | `SCSI` |\n| `cocpu.html` | Sys-Ctrl-Cocpu-Mind | Co-CPU Mind Controller, steuert IQQ + Richtung (earn.js) | `COCPU` |\n| `ui.html` | Morphcontrol-Resp-Omit-Live | Morphcontrol alt/neu, online/offline Switch, responsive omit logic | `UI` |\n| `Soccer.html` | Soccer-Feld-Regel-Fur | Feld Regeln für Soccer: Fur = Regelwerk | `SOCCER` |\n| `schach.feld.html` | 9x9=81 | Schach auf 9x9 = 81 Felder, statt 8x8=64. Neue Rolle nötig. | `SCHACH` |\n| `bewegung.html` | Bewegung | Bewegungs-Physik, initial print Hello → Goodbye State Machine | `MOVE` |\n| `earn.js` | IQQ | `learningDirection` + `IQQ adjustment` — lernt ob Ball oder Wetter | `EARN` |\n\n---\n\n## 02 — RAM und ROM\n\n### RAM — Volatile, Fast, für ball runtime\n\nRAM ist nicht persistent. Ball braucht RAMDISK um zu rollen.\n\n**Quellen (Kleinanzeigen / Hardware):**\n- `ADATA XPG 64GB DDR4 3200 SODIMM 4168 MB/s` — primär für ball.html runtime\n- `Crucial DDR5 4800 32GB` — für wetter partikel buffer\n- `Samsung DDR4 16GB 2666` — fallback für cocpu\n- Volatil, muss bei jedem Start neu gemountet werden als `/ram/`\n\n```bash\n/ram/\n  ├── ball.ramdisk.img      # 2in1 runtime\n  ├── wetter.particles.bin  # wetter.html braucht 64MB+\n  └── cocpu.cache\n```\n\n### ROM — Persistent, VESTA + CDN + GitHub\n\nROM ist persistent. Hält Regeln, Vektoren, externe Attachments.\n\n**Quellen:**\n- `spin.rom` — Basis ROM für ball (Rotation + Spin Vector)\n- `VESTA 300k vectors` — 300.000 Vektoren für Rolle + Schach Feld\n- `cdn.fbsbx.com / FB CDN attachment` — Internet Regel: CDN = temporär, darf sterben\n- `github.io pages / directR.html` — Internet Regel: GitHub = persistent, wenn CDN tot\n- `directR.html` — direkter ROM Redirect\n\n```bash\n/rom/\n  ├── spin.rom              # für ball.html\n  ├── vesta.300k.vec        # für rolle + schach.feld\n  ├── wetter.regel.json     # cdn vs github regel\n  ├── directR.html\n  └── soccer.feld.regel\n```\n\n> **Regel:** `ball` ohne `spin.rom` = kein Spin. `wetter` ohne `ram/` = keine Partikel.\n\n---\n\n## 03 — Dependencies\n\nDas ist das Herzstück. Wer braucht wen?\n\n```\n[RAM] ─┐\n       ├──→ [ball] ──→ [wetter] ──→ [rolle] ──┬─→ [soccer]\n[ROM] ─┘      │           │            │        └─→ [schach.feld]\n              │           │            │\n              │           └─→ [scsi] ←──┘\n              │                 │\n              └─→ [cocpu] ←─────┘\n                    │\n[earn.js] ──────────┘\n                    ↓\n                 [ui] = morphcontrol = alles zusammen alt/neu online/offline\n```\n\n### Detail Regeln:\n\n**ball depends on:**\n- `ram` (braucht ramdisk minimal, sonst kein Runtime)\n- `rom` (spin.rom für Rotation)\n- `bewegung.html` (für Bewegung)\n\n**wetter depends on:**\n- `ball` (ball ist Transport — Wetter reitet auf Ball)\n- `ram` (für Wetter Partikel Buffer)\n- `internet rules` (cdn vs github — wenn cdn.fbsbx.com tot, fallback auf github.io)\n- `rom/wetter.regel.json`\n\n**rolle depends on:**\n- `ball` + `wetter` + `scsi`\n- Rolle definiert: Wer ist Ball Entwickler, wer ist Tor Macher, wer ist Feld?\n- Liest VESTA vectors aus ROM\n\n**soccer depends on:**\n- `ball` + `wetter` (Feld Regeln brauchen Ball Position + Wetter)\n\n**schach.feld depends on:**\n- `rolle` + `cocpu` — 9x9 braucht neue Rollen + Mind Controller\n- `VESTA 300k`\n\n**ui depends on:**\n- `all` für morphcontrol — alt/neu, online/offline, resp/omit/live\n\n**scsi = Controller:**\n- Sortiert alles, 8te Sorter, verbindet RAM→ROM→BALL\n\n---\n\n## 04 — CO2 → O2 + 1000€ Schein Logik\n\nIn `wetter.html` + `rolle.html` ist versteckte Wirtschaftslogik:\n\n- CO2 → O2 Conversion = Wetter reinigt Feld\n- Wenn Conversion > 80%, spawn 1000€ Schein als Belohnung im Soccer Feld\n- Schein = NFT-ähnlich, aber nur ROM persistent (nicht RAM)\n- `earn.js` trackt IQQ: Je mehr CO2→O2, desto höher IQQ\n\n```js\n// earn.js pseudo\nif (wetter.CO2toO2 > 0.8) {\n  rolle.spawn('1000€', { persistent: 'rom' });\n  cocpu.IQQ += 1;\n}\n```\n\n---\n\n## 05 — How to run: HUB BORG 7482\n\n1. Open `index.html` im Browser — kein Server nötig\n2. index lädt als HUB: ball → wetter → rolle → scsi → cocpu → ui\n3. Wenn `/ram/` fehlt, zeigt ball \"NO RAM\" Gold Warnung\n4. Wenn `/rom/` fehlt, fallback auf cdn.fbsbx.com (kann 404)\n5. Alles läuft als BORG #02060a mit #ffd700 Gold\n\n```bash\n# lokal testen\nopen index.html\n# oder\npython3 -m http.server 8000\n# → http://localhost:8000/index.html\n```\n\n---\n\n## 06 — Diagram: Dependency Graph\n\n> Siehe SVG unten — ball → wetter → rolle ist Main Chain. scsi ist Controller in Mitte.\n\n- **Gelb/Gold** = RAM/ROM Quellen\n- **Weiß** = Module\n- **Gestrichelt** = Internet Fallback (cdn vs github)\n\n---\n\n## 07 — In
