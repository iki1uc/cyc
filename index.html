<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C:\\CYC\\ - Speed Commander SC - BORG 7482</title>
<style>
:root{--sc:#0000aa;--sc2:#000080;--sc3:#0000cc;--gold:#ffd700;--gold2:#ffcc00;--dark:#02060a;--dark2:#0a1020;--cyan:#00ffff;--gray:#c0c0c0;}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--dark);color:#a0b0ff;font-family:Consolas,'Courier New',monospace;font-size:13px;overflow:hidden}
button,input{font-family:inherit}
#root{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%, #001a4a 0%, var(--dark) 60%)}
.menu-bar{display:flex;flex-wrap:wrap;background:var(--gray);color:#000;padding:3px 6px;gap:2px;font-weight:bold;border-bottom:2px solid #000;user-select:none}
.menu-bar .mi{padding:2px 10px;cursor:pointer} .menu-bar .mi:hover,.menu-bar .mi.active{background:var(--sc);color:#fff} .menu-bar .mi.gold{color:#7a5a00} .menu-bar .mi.gold:hover{color:#fff;background:#b89400}
.top-info{display:flex;align-items:center;gap:10px;background:#001030;color:var(--gold);padding:2px 8px;font-size:11px;border-bottom:1px solid #002050}
.led{width:8px;height:8px;border-radius:50%;background:#0f0;box-shadow:0 0 6px #0f0;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.panels-wrap{flex:1;display:flex;gap:2px;background:var(--sc);padding:2px;min-height:0;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--sc);border:2px solid var(--cyan);position:relative;overflow:hidden}
.panel.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 16px rgba(255,215,0,.25)}
.panel-head{background:var(--sc2);color:var(--gold);padding:4px 8px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;border-bottom:1px solid var(--cyan);font-size:12px}
.panel-head .path{background:#000;color:#fff;padding:2px 6px;border:1px solid #333;flex:1;margin-right:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.panel-tabs{display:flex;gap:2px}
.ptab{padding:2px 8px;background:#001040;color:#6af;font-size:11px;cursor:pointer;border:1px solid #002050} .ptab.active{background:var(--gold);color:#000;border-color:var(--gold)}
.file-area{flex:1;overflow:auto;background:var(--sc);position:relative}
table.files{width:100%;border-collapse:collapse;table-layout:fixed}

function triggerPaint(target,type){
pendingBoot={target:target,type:type};
var canvas=document.getElementById('paintCanvas');
canvas.style.display='block';
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
var ctx=canvas.getContext('2d');
var start=performance.now();
var duration=2500;
function draw(now){
var elapsed=now-start;
var p=Math.min(elapsed/duration,1);
var w=canvas.width,h=canvas.height;
ctx.clearRect(0,0,w,h);
var bgGrad=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h));
bgGrad.addColorStop(0,'#001a4a');bgGrad.addColorStop(1,'#02060a');
ctx.fillStyle=bgGrad;ctx.fillRect(0,0,w,h);
var radius = Math.max(w,h)*0.15 + p*Math.max(w,h)*1.2;
var inkGrad=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,radius);
inkGrad.addColorStop(0,'rgba(255,215,0,0.95)');inkGrad.addColorStop(0.15,'rgba(0,0,170,0.9)');inkGrad.addColorStop(0.4,'rgba(0,0,80,0.8)');inkGrad.addColorStop(1,'rgba(2,6,10,0)');
ctx.fillStyle=inkGrad;
ctx.beginPath();ctx.arc(w/2,h/2,radius,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='rgba(255,215,0,'+(0.3+0.7*p)+')';ctx.lineWidth=2+p*6;ctx.stroke();
var dripCount=8;
for(var i=0;i<dripCount;i++){
var angle=(i/dripCount)*Math.PI*2 + p*0.5;
var dripR=radius*0.3 + Math.sin(p*10+i)*10;
