export function paintTransition(from, to, type = 'tusche', callback) {
  const canvas = document.getElementById('pr-paint-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);

  const src = from === 'SC' ? '#0000aa' : '#02060a';
  const dst = to === 'OS' ? '#02060a' : '#0000aa';
  const accent = to === 'OS' ? '#ffd700' : '#5a7bff';

  const duration = 2500;
  const start = performance.now();
  const goldParticles = Array.from({length: 81}, () => ({
    x: Math.random()*w, y: Math.random()*h,
    r: Math.random()*2.2+0.3, vx: (Math.random()-0.5)*0.6
  }));

  function ease(t){ return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }

    const p = ease(raw);

    ctx.fillStyle = src;
    ctx.fillRect(0,0,w,h);

  }

}
